app.use-stub-weather=true
weather.openweather.base-url=https://api.openweathermap.org
weather.openweather.api-key=${OPENWEATHER_API_KEY:}
weather.openweather.onecall-path=/data/3.0/onecall
weather.openweather.units=metric
weather.openweather.lang=ko
spring.jackson.time-zone=Asia/Seoul
spring.cache.type=simple
spring.cache.caffeine.spec=expireAfterWrite=15m

server:
  port: ${PORT:8080}
